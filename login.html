<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detecor X — вход</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap" style="max-width:480px;padding-top:12vh"><div class="brand"><b>Detecor <i>X</i></b></div><h1>Закрытый <span>кабинет</span></h1><p class="lead">Доступ только для владельца проекта.</p><div class="card"><form id="form"><label for="pass">Пароль администратора</label><input id="pass" type="password" required autocomplete="current-password" style="display:block;width:100%;padding:14px;border:1px solid var(--bd);border-radius:12px;margin:14px 0;background:var(--sf);color:var(--tx)"><button class="btn p" style="width:100%;justify-content:center">Войти</button><p id="msg" class="note"></p></form></div><a href="/">← Вернуться на сайт</a></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/control/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pass').value})});const j=await r.json();if(r.ok)location.href='/control/console';else document.getElementById('msg').textContent=j.error||'Ошибка входа'};</script></body></html>
